name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binary:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: brie
            archive: brie-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: brie
            archive: brie-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: >
          tar -czf ${{ matrix.archive }} -C
          target/${{ matrix.target }}/release ${{ matrix.bin }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
